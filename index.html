<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Drama Hub | El Rincón del Drama</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #fdf2f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin-slow { animation: spinSlow 10s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const fixImage = async (e, enTitle) => {
      if (e.target.dataset.fixed) return;
      e.target.dataset.fixed = "true";
      try {
        const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(enTitle)}`);
        const data = await res.json();
        if (data && data.length > 0 && data[0].show.image) {
          e.target.src = data[0].show.image.original || data[0].show.image.medium;
        } else {
          e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(enTitle)}&background=fdf2f8&color=db2777&size=500`;
        }
      } catch (err) {
        e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(enTitle)}&background=fdf2f8&color=db2777&size=500`;
      }
    };

    const kdramas = [
      { id: 1, title: "El juego del calamar", enTitle: "Squid Game", youtubeId: "cTpISvwP9DM", synopsis: "Cientos de jugadores cortos de dinero aceptan una extraña invitación a competir en letales juegos infantiles.", review: "Contexto: Un thriller de supervivencia extremo. Te mantendrá al borde del asiento de principio a fin.", platform: "Netflix", link: "https://www.netflix.com/title/81040344", image: "https://image.tmdb.org/t/p/w500/dDlEmu3EZVPIsptg9c8F1wFvQQ9.jpg" },
      { id: 2, title: "Aterrizaje de emergencia en tu corazón", enTitle: "Crash Landing on You", youtubeId: "GVQbeG5yW78", synopsis: "Una heredera surcoreana sufre un accidente de parapente y cae en Corea del Norte, donde un oficial intenta protegerla.", review: "Contexto: Combina romance épico, comedia y un choque cultural fascinante. Un clásico imperdible.", platform: "Netflix", link: "https://www.netflix.com/title/81159258", image: "https://image.tmdb.org/t/p/w500/vJTc49uXhZ1VpS6Gq4N3u838XFz.jpg" },
      { id: 3, title: "Belleza verdadera", enTitle: "True Beauty", youtubeId: "0kUSz0TuFME", synopsis: "Una estudiante de secundaria domina el arte del maquillaje para transformarse en la chica más popular de la escuela.", review: "Contexto: Divertida, ligera y con un triángulo amoroso que dividió al internet.", platform: "Viki", link: "https://www.viki.com/tv/37374c-true-beauty", image: "https://image.tmdb.org/t/p/w500/r5inEhpT5K3xO7eN3u6eGf45yR1.jpg" },
      { id: 4, title: "Woo, una abogada extraordinaria", enTitle: "Extraordinary Attorney Woo", youtubeId: "VMmHbg1m034", synopsis: "Una abogada brillante en el espectro autista lidia con los retos del tribunal y del día a día.", review: "Contexto: Una historia conmovedora y llena de aprendizajes sobre la empatía.", platform: "Netflix", link: "https://www.netflix.com/title/81511318", image: "https://image.tmdb.org/t/p/w500/zeXXUydkXhQ82O3KOP9U50Bq7Xv.jpg" },
      { id: 5, title: "Goblin", enTitle: "Goblin", youtubeId: "wdHeiVf0mds", synopsis: "Un duende inmortal necesita a una novia humana para poner fin a su vida eterna, pero se enamora de ella.", review: "Contexto: Fantasía, reencarnación y un 'bromance' legendario. Prepara los pañuelos.", platform: "Viki", link: "https://www.viki.com/tv/31706c-guardian-the-lonely-and-great-god", image: "https://image.tmdb.org/t/p/w500/c77zN6r9T2nL83uL2gT1u3qUv0p.jpg" },
      { id: 6, title: "Propuesta laboral", enTitle: "Business Proposal", youtubeId: "Us6S8NRHtpE", synopsis: "Una mujer se hace pasar por su amiga en una cita a ciegas para ahuyentar al pretendiente, pero resulta ser su jefe.", review: "Contexto: La comedia romántica perfecta para salir de un bloqueo. Llena de clichés ejecutados a la perfección.", platform: "Netflix", link: "https://www.netflix.com/title/81503927", image: "https://image.tmdb.org/t/p/w500/6KMhKm2ZHG8KUtg4lhsNUdt4iPh.jpg" },
      { id: 7, title: "Vincenzo", enTitle: "Vincenzo", youtubeId: "S12-4mXCNj4", synopsis: "Un abogado de la mafia de origen coreano regresa a su tierra natal para darle a un conglomerado corrupto su merecido.", review: "Contexto: Acción estilizada, humor negro y un protagonista anti-héroe carismático.", platform: "Netflix", link: "https://www.netflix.com/title/81365087", image: "https://image.tmdb.org/t/p/w500/kL6jG4A42V7p5T4C8m2T5k1bZ1X.jpg" },
      { id: 8, title: "Estamos muertos", enTitle: "All of Us Are Dead", youtubeId: "62jVLZ4JfjM", synopsis: "Un grupo de estudiantes atrapados en su escuela secundaria deben luchar por sobrevivir cuando un virus zombi se propaga.", review: "Contexto: Pone a prueba la moralidad humana en situaciones límite de supervivencia.", platform: "Netflix", link: "https://www.netflix.com/title/81226810", image: "https://image.tmdb.org/t/p/w500/6iG8A6xV1u5L3l4Z6l3t9z1Q3L1.jpg" },
      { id: 9, title: "Mi adorable demonio", enTitle: "My Demon", youtubeId: "Yt5Q2zi-peQ", synopsis: "Un demonio pierde sus poderes y debe convivir con una heredera fría y arrogante para recuperarlos.", review: "Contexto: Un romance moderno con toques sobrenaturales. Increíble cinematografía.", platform: "Netflix", link: "https://www.netflix.com/title/81712802", image: "https://image.tmdb.org/t/p/w500/b3YjF9VdI5hUuC3R5xU6n5O3p5T.jpg" },
      { id: 10, title: "La gloria", enTitle: "The Glory", youtubeId: "agXLKfQPulg", synopsis: "Años después de sobrevivir a un brutal acoso escolar, una mujer pone en marcha un elaborado plan de venganza.", review: "Contexto: Oscura, madura y psicológicamente atrapante. Una historia de venganza brillante.", platform: "Netflix", link: "https://www.netflix.com/title/81517783", image: "https://image.tmdb.org/t/p/w500/jP9k3s6v7Z4a6T3r2G4p4q5s2v1.jpg" },
      { id: 11, title: "Itaewon Class", enTitle: "Itaewon Class", youtubeId: "59z-8_rkx-g", synopsis: "Un ex convicto y sus amigos luchan por hacer realidad sus ambiciosos sueños de abrir un bar en Seúl.", review: "Contexto: Inspiradora y motivacional. Trata temas de superación personal y lealtad.", platform: "Netflix", link: "https://www.netflix.com/title/81193309", image: "https://image.tmdb.org/t/p/w500/3bFWpB2tD0Pq2kntL9DqKkP8kGu.jpg" },
      { id: 12, title: "Alquimia de almas", enTitle: "Alchemy of Souls", youtubeId: "edX2zSPrSK8", synopsis: "Una poderosa hechicera en el cuerpo de una mujer ciega es convocada por un hombre de una prestigiosa familia.", review: "Contexto: Magia, artes marciales y romance en un mundo de fantasía histórico.", platform: "Netflix", link: "https://www.netflix.com/title/81517188", image: "https://image.tmdb.org/t/p/w500/2vWnJ4Y29dIVoE3WlC4dZ2r6O0S.jpg" },
      { id: 13, title: "Parásitos", enTitle: "Parasite", youtubeId: "5xH0HfJHsaY", synopsis: "La familia Ki-taek se interesa por la rica familia Park, hasta que se enredan en un incidente inesperado.", review: "Contexto: Obra maestra del cine moderno que mezcla humor negro con suspenso magistral.", platform: "Max", link: "https://www.max.com/", image: "https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg" },
      { id: 14, title: "Estación Zombie / Train to Busan", enTitle: "Train to Busan", youtubeId: "roKEPJJRqVk", synopsis: "Los pasajeros de un tren que viaja de Seúl a Busan luchan por sobrevivir al estallido de un virus zombi.", review: "Contexto: Redefinió el género zombi mundialmente. Explora el egoísmo y sacrificio humano.", platform: "Prime Video", link: "https://www.primevideo.com/", image: "https://m.media-amazon.com/images/M/MV5BMTkwOTQ4OTg0OV5BMl5BanBnXkFtZTgwMzQyOTM0OTE@._V1_FMjpg_UX1000_.jpg" },
      { id: 15, title: "El monstruo de la vieja Seúl", enTitle: "Gyeongseong Creature", youtubeId: "u1slFDs6yg0", synopsis: "Durante la ocupación japonesa de Corea en 1945, dos jóvenes se enfrentan a una extraña criatura.", review: "Contexto: Excelente ambientación de época y misterio. Mezcla drama y ciencia ficción.", platform: "Netflix", link: "https://www.netflix.com/title/81577168", image: "https://image.tmdb.org/t/p/w500/b7tB2h9f4J6x6H0O8O3w1E9j0B5.jpg" },
      { id: 16, title: "Snowdrop", enTitle: "Snowdrop", youtubeId: "g8JO-wRmlEU", synopsis: "En 1987, una estudiante universitaria oculta a un hombre ensangrentado en su dormitorio en tiempos convulsos.", review: "Contexto: Intenso drama político y romántico con Jisoo de BLACKPINK.", platform: "Disney+", link: "https://www.disneyplus.com/", image: "https://image.tmdb.org/t/p/w500/eN8e2O6M3D6u0M9S2N7r7L9z1B4.jpg" },
      { id: 17, title: "Pasillos de hospital", enTitle: "Hospital Playlist", youtubeId: "KYfPX4TgS8s", synopsis: "Cinco médicos que son amigos desde la escuela enfrentan los altibajos de su profesión y vida personal.", review: "Contexto: Confortable, cálida y muy realista. Se enfoca en la amistad genuina.", platform: "Netflix", link: "https://www.netflix.com/title/81239224", image: "https://image.tmdb.org/t/p/w500/wJJJZf9HKMfwQGusC0pHUJ7TeH5.jpg" },
      { id: 18, title: "Veinticinco, veintiuno", enTitle: "Twenty Five Twenty One", youtubeId: "V9NLRnpaxeo", synopsis: "Una joven esgrimista persigue sus ambiciones y conoce a un joven que busca reconstruir su vida.", review: "Contexto: Nostalgia pura de los años 90s. Una carta de amor a los primeros amores y sueños.", platform: "Netflix", link: "https://www.netflix.com/title/81517168", image: "https://image.tmdb.org/t/p/w500/5mW5wHWAA3axMrEMlm7zZ86fNe3.jpg" },
      { id: 19, title: "King the Land", enTitle: "King the Land", youtubeId: "aGMMc91uLjQ", synopsis: "El heredero de un conglomerado choca con una dedicada empleada hotelera conocida por su sonrisa.", review: "Contexto: Romcom clásica sin complicaciones. Dulce, divertida y hermosa.", platform: "Netflix", link: "https://www.netflix.com/title/81671440", image: "https://image.tmdb.org/t/p/w500/1MfaXheNvt6UvEE3gqj2Pudn7N.jpg" },
      { id: 20, title: "La reina de las lágrimas", enTitle: "Queen of Tears", youtubeId: "ZUhHqdMknqA", synopsis: "La reina de los grandes almacenes y el príncipe de los supermercados atraviesan una crisis conyugal.", review: "Contexto: Explora qué pasa después del 'fueron felices para siempre' con mucha emotividad.", platform: "Netflix", link: "https://www.netflix.com/title/81707950", image: "https://image.tmdb.org/t/p/w500/t0A0PZp0f6mXU2T0Wf1g0A2T3W.jpg" }
    ];

    const HeroVideoYouTubeBackground = () => {
      return (
        <div className="relative w-full h-[55vh] md:h-[65vh] min-h-[420px] overflow-hidden bg-pink-950 flex items-center justify-center shadow-lg">
          <div className="absolute inset-0 w-full h-full pointer-events-none overflow-hidden">
            <iframe
              className="absolute top-1/2 left-1/2 w-[300vw] h-[300vh] -translate-x-1/2 -translate-y-1/2 md:w-[150vw] md:h-[150vh] opacity-75"
              src="https://www.youtube-nocookie.com/embed/cTpISvwP9DM?autoplay=1&mute=1&controls=0&disablekb=1&loop=1&playlist=cTpISvwP9DM&playsinline=1"
              frameBorder="0"
              allow="autoplay; encrypted-media"
            ></iframe>
          </div>
          
          <div className="absolute inset-0 bg-pink-950 bg-opacity-60 mix-blend-multiply"></div>
          <div className="absolute inset-0 bg-gradient-to-b from-transparent to-[#fdf2f8]"></div>
          
          <div className="relative z-10 text-center px-4 max-w-4xl mx-auto animate-fade-in">
             <span className="bg-pink-500 text-white text-xs md:text-sm font-bold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-md inline-block mb-4">
               Especial de K-Dramas
             </span>
             <h2 className="text-4xl md:text-6xl font-extrabold text-white drop-shadow-xl mb-4 tracking-wide">
               El Rincón del Drama
             </h2>
             <p className="text-lg md:text-2xl text-pink-100 drop-shadow-md font-medium max-w-2xl mx-auto leading-relaxed">
               Descubre, enamórate y explora las mejores historias y producciones de Corea del Sur en un solo lugar.
             </p>
          </div>
        </div>
      );
    };

    const QuizSection = ({ toggleWatchlist, watchlist }) => {
      const [step, setStep] = useState(0);
      const [scores, setScores] = useState({ 2: 0, 6: 0, 1: 0, 10: 0 });
      const [resultId, setResultId] = useState(null);

      const questions = [
        {
          q: "1. ¿Qué tipo de historia buscas ver hoy?",
          options: [
            { text: "Un romance épico que me haga llorar y reír 💖", id: 2 },
            { text: "Comedia ligera llena de clichés divertidos 😂", id: 6 },
            { text: "Tensión extrema y supervivencia al límite 💀", id: 1 },
            { text: "Un misterio oscuro con venganza perfecta 🗡️", id: 10 }
          ]
        },
        {
          q: "2. Si pudieras viajar a uno de estos escenarios, ¿cuál elegirías?",
          options: [
            { text: "Un pueblo escondido en las montañas 🌲", id: 2 },
            { text: "Una lujosa oficina en el centro de Seúl 🏢", id: 6 },
            { text: "Una isla secreta sin escapatoria 🏝️", id: 1 },
            { text: "La escuela donde solían estudiar mis enemigos 🏫", id: 10 }
          ]
        },
        {
          q: "3. ¿Quién sería tu compañero ideal?",
          options: [
            { text: "Un soldado guapo que me proteja de todo 🪖", id: 2 },
            { text: "Un CEO millonario pero un poco torpe 👔", id: 6 },
            { text: "Alguien astuto que me ayude a sobrevivir 🏃‍♂️", id: 1 },
            { text: "Un aliado fiel que no haga preguntas 🤝", id: 10 }
          ]
        }
      ];

      const handleAnswer = (id) => {
        const newScores = { ...scores, [id]: scores[id] + 1 };
        setScores(newScores);
        
        if (step < questions.length - 1) {
          setStep(step + 1);
        } else {
          const winnerId = Object.keys(newScores).reduce((a, b) => newScores[a] > newScores[b] ? a : b);
          setResultId(Number(winnerId));
        }
      };

      const resetQuiz = () => {
        setStep(0);
        setScores({ 2: 0, 6: 0, 1: 0, 10: 0 });
        setResultId(null);
      };

      if (resultId) {
        const winner = kdramas.find(d => d.id === resultId);
        const inList = watchlist.includes(winner.id);
        
        return (
          <div className="bg-gradient-to-br from-pink-100 to-white rounded-2xl p-8 shadow-lg border border-pink-200 text-center animate-fade-in mb-12">
            <h3 className="text-2xl font-bold text-pink-600 mb-4">¡Tenemos el K-Drama perfecto para ti!</h3>
            <div className="max-w-xs mx-auto bg-white rounded-xl shadow-md overflow-hidden mb-6 border border-pink-50">
               <img src={winner.image} alt={winner.title} className="w-full h-48 object-cover" onError={(e) => fixImage(e, winner.enTitle)} />
               <div className="p-4">
                 <h4 className="font-bold text-lg text-gray-800">{winner.title}</h4>
                 <p className="text-sm text-gray-600 mt-1 line-clamp-2">{winner.synopsis}</p>
               </div>
            </div>
            <div className="flex justify-center gap-4">
              <button onClick={() => toggleWatchlist(winner.id)} className={`px-6 py-3 rounded-full font-bold shadow-md transition-transform active:scale-95 flex items-center ${inList ? 'bg-gray-200 text-gray-700' : 'bg-pink-500 text-white hover:bg-pink-600'}`}>
                {inList ? '✅ Guardado en Mi Lista' : '🤍 Añadir a Mi Lista'}
              </button>
              <button onClick={resetQuiz} className="px-6 py-3 rounded-full font-bold text-pink-600 bg-white border-2 border-pink-200 hover:bg-pink-50 transition-colors">Volver a jugar</button>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl p-6 md:p-8 shadow-lg border border-pink-100 mb-12 animate-fade-in">
          <div className="flex items-center justify-between mb-6">
            <h2 className="text-2xl font-bold text-gray-800 flex items-center">
              <span className="text-3xl mr-2">🔮</span> ¿Qué K-Drama deberías ver hoy?
            </h2>
            <span className="text-sm font-bold text-pink-500 bg-pink-100 px-3 py-1 rounded-full">Pregunta {step + 1} / 3</span>
          </div>
          
          <h3 className="text-xl text-center font-semibold text-gray-700 mb-6">{questions[step].q}</h3>
          
          <div className="grid md:grid-cols-2 gap-4">
            {questions[step].options.map((opt, i) => (
              <button 
                key={i} 
                onClick={() => handleAnswer(opt.id)}
                className="bg-pink-50 hover:bg-pink-500 hover:text-white text-gray-700 font-medium p-4 rounded-xl text-left transition-all duration-300 transform hover:-translate-y-1 hover:shadow-md border border-pink-100"
              >
                {opt.text}
              </button>
            ))}
          </div>
        </div>
      );
    };

    const Carousel = ({ dramas, onSelectDrama }) => {
      return (
        <div className="w-full bg-pink-100 py-6 mb-8 shadow-inner">
          <div className="max-w-6xl mx-auto px-4">
            <h2 className="text-xl font-bold text-pink-700 mb-4 flex items-center">
              <svg className="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
              Galería de Dramas
            </h2>
            <div className="flex gap-4 overflow-x-auto hide-scroll snap-x py-2">
              {dramas.map((drama) => (
                <div key={`carousel-${drama.id}`} onClick={() => onSelectDrama(drama)} className="snap-center shrink-0 w-32 md:w-40 relative group cursor-pointer hover:-translate-y-2 transition-transform duration-300 bg-gray-200 rounded-lg">
                  <img src={drama.image} alt={drama.title} referrerPolicy="no-referrer" onError={(e) => fixImage(e, drama.enTitle)} className="w-full h-48 md:h-60 object-cover rounded-lg shadow-md" />
                  <div className="absolute inset-0 bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex items-end p-2">
                    <span className="text-white text-xs font-bold leading-tight">{drama.title}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const DramaCard = ({ drama, toggleWatchlist, watchlist, onPlayTrailer }) => {
      const inList = watchlist.includes(drama.id);

      return (
        <div className="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 flex flex-col border border-pink-100 overflow-hidden">
          <div className="relative h-56 md:h-64 bg-gray-100">
            <img src={drama.image} alt={drama.title} referrerPolicy="no-referrer" onError={(e) => fixImage(e, drama.enTitle)} className="w-full h-full object-cover" />
            
            <div className="absolute top-3 left-3 flex gap-2">
              <button onClick={() => toggleWatchlist(drama.id)} className="bg-white/90 p-2 rounded-full shadow-md hover:bg-pink-50 transition-colors">
                <svg className={`w-6 h-6 ${inList ? 'text-pink-500 fill-current' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              </button>
            </div>
            <div className="absolute top-3 right-3">
              <span className="bg-white/90 text-pink-600 px-3 py-1 rounded-full text-sm font-bold shadow-md">{drama.platform}</span>
            </div>
          </div>

          <div className="p-5 flex-grow flex flex-col">
            <h3 className="text-xl font-bold text-gray-800 mb-2">{drama.title}</h3>
            <p className="text-gray-600 text-sm mb-3 flex-grow">{drama.synopsis}</p>
            
            <div className="bg-pink-50 border-l-4 border-pink-400 p-3 mb-4 rounded-r-lg">
              <p className="text-xs text-gray-700 italic">{drama.review}</p>
            </div>

            <div className="flex gap-2 mt-auto">
              <button 
                onClick={() => onPlayTrailer(drama)}
                className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg flex justify-center items-center transition-colors text-sm">
                <svg className="w-5 h-5 mr-1 text-pink-600" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>
                Ver Tráiler
              </button>
              
              <a href={drama.link} target="_blank" rel="noopener noreferrer" className="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-4 rounded-lg flex justify-center items-center transition-colors text-sm">
                Ver en {drama.platform}
              </a>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [watchlist, setWatchlist] = useState(() => JSON.parse(localStorage.getItem('kdrama_watchlist')) || []);
      const [votes, setVotes] = useState(() => JSON.parse(localStorage.getItem('kdrama_votes')) || { dramaA: 53, dramaB: 47 });
      const [reviews, setReviews] = useState(() => JSON.parse(localStorage.getItem('kdrama_reviews')) || [
        { id: 1, name: "Maria", text: "¡Lloré muchísimo con Aterrizaje de emergencia!", drama: "Aterrizaje de emergencia en tu corazón" }
      ]);
      const [newReview, setNewReview] = useState({ name: '', text: '', drama: 'General' });
      const [activeTrailer, setActiveTrailer] = useState(null);
      const [isPlayingMusic, setIsPlayingMusic] = useState(false);

      useEffect(() => { localStorage.setItem('kdrama_watchlist', JSON.stringify(watchlist)); }, [watchlist]);
      useEffect(() => { localStorage.setItem('kdrama_votes', JSON.stringify(votes)); }, [votes]);
      useEffect(() => { localStorage.setItem('kdrama_reviews', JSON.stringify(reviews)); }, [reviews]);

      const toggleWatchlist = (id) => {
        setWatchlist(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
      };

      const handleVote = (option) => {
        setVotes(prev => ({ ...prev, [option]: prev[option] + 1 }));
        alert("¡Voto registrado!");
      };

      const submitReview = (e) => {
        e.preventDefault();
        if (newReview.name && newReview.text) {
          setReviews([{ id: Date.now(), ...newReview }, ...reviews]);
          setNewReview({ name: '', text: '', drama: 'General' });
        }
      };

      const totalVotes = votes.dramaA + votes.dramaB;
      const percentA = Math.round((votes.dramaA / totalVotes) * 100);
      const percentB = 100 - percentA;

      return (
        <div className="min-h-screen pb-12 relative">
          <header className="bg-white shadow-sm sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
              <h1 className="text-3xl font-extrabold text-pink-600 flex items-center">
                <span className="text-4xl mr-2">📺</span> K-Drama Hub
              </h1>
              <div className="flex items-center text-pink-600 font-bold bg-pink-100 px-4 py-2 rounded-full cursor-pointer hover:bg-pink-200 transition-colors">
                <svg className="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clipRule="evenodd"></path></svg>
                Mi Lista ({watchlist.length})
              </div>
            </div>
          </header>

          <HeroVideoYouTubeBackground />
          
          <Carousel dramas={kdramas} onSelectDrama={(drama) => setActiveTrailer(drama)} />

          <main className="max-w-6xl mx-auto px-4 mt-8">
            
            <QuizSection toggleWatchlist={toggleWatchlist} watchlist={watchlist} />

            <section className="mb-12 bg-white rounded-2xl p-6 md:p-8 shadow-lg border border-pink-100">
              <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                <svg className="w-7 h-7 mr-2 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Batalla de Fans en Vivo
              </h2>

              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-gray-50 p-4 rounded-xl border border-pink-100 shadow-inner">
                  <div className="flex justify-between mb-2 font-bold text-sm">
                    <span className="text-pink-600">Aterrizaje de emergencia... ({percentA}%)</span>
                    <span className="text-blue-600">La reina de las lágrimas ({percentB}%)</span>
                  </div>
                  <div className="h-5 w-full bg-blue-100 rounded-full overflow-hidden flex shadow-inner">
                    <div className="h-full bg-pink-500 transition-all duration-500" style={{ width: `${percentA}%` }}></div>
                    <div className="h-full bg-blue-500 transition-all duration-500" style={{ width: `${percentB}%` }}></div>
                  </div>
                </div>

                <div className="grid md:grid-cols-2 gap-6">
                  <div className="text-center bg-pink-50 p-6 rounded-2xl border border-pink-100 flex flex-col justify-between shadow-sm">
                    <h3 className="font-bold text-base mb-4 text-gray-800">Aterrizaje de emergencia en tu corazón</h3>
                    <button onClick={() => handleVote('dramaA')} className="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 px-6 rounded-full w-full transition-transform active:scale-95 shadow-md">¡Votar por este!</button>
                  </div>

                  <div className="text-center bg-blue-50 p-6 rounded-2xl border border-blue-100 flex flex-col justify-between shadow-sm">
                    <h3 className="font-bold text-base mb-4 text-gray-800">La reina de las lágrimas</h3>
                    <button onClick={() => handleVote('dramaB')} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-6 rounded-full w-full transition-transform active:scale-95 shadow-md">¡Votar por este!</button>
                  </div>
                </div>
              </div>
            </section>

            <h2 className="text-3xl font-bold text-gray-800 mb-6 flex items-center border-b-2 border-pink-200 pb-2 inline-block">
               Catálogo Popular
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-12">
              {kdramas.map(drama => (
                <DramaCard key={drama.id} drama={drama} toggleWatchlist={toggleWatchlist} watchlist={watchlist} onPlayTrailer={(d) => setActiveTrailer(d)} />
              ))}
            </div>

            <section className="bg-white rounded-2xl p-6 md:p-8 shadow-lg border border-pink-100 mb-12">
              <h2 className="text-2xl font-bold text-gray-800 mb-6">Comunidad y Reseñas</h2>
              
              <div className="grid md:grid-cols-3 gap-8">
                <div className="md:col-span-1">
                  <form onSubmit={submitReview} className="bg-pink-50 p-5 rounded-xl border border-pink-100">
                    <h3 className="font-bold mb-4 text-gray-800">Deja tu opinión</h3>
                    <input type="text" placeholder="Tu nombre" required className="w-full mb-3 p-2 rounded-lg border border-gray-300 shadow-sm focus:border-pink-300 focus:ring focus:ring-pink-200 outline-none" value={newReview.name} onChange={e => setNewReview({...newReview, name: e.target.value})} />
                    <select className="w-full mb-3 p-2 rounded-lg border border-gray-300 shadow-sm outline-none text-sm bg-white" value={newReview.drama} onChange={e => setNewReview({...newReview, drama: e.target.value})}>
                      <option value="General">Opinión General</option>
                      {kdramas.map(d => <option key={`opt-${d.id}`} value={d.title}>{d.title}</option>)}
                    </select>
                    <textarea placeholder="¿Qué te pareció?" required rows="3" className="w-full mb-3 p-2 rounded-lg border border-gray-300 shadow-sm focus:border-pink-300 focus:ring focus:ring-pink-200 outline-none resize-none" value={newReview.text} onChange={e => setNewReview({...newReview, text: e.target.value})}></textarea>
                    <button type="submit" className="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 rounded-lg shadow-md transition-colors active:scale-95">Publicar Reseña</button>
                  </form>
                </div>
                
                <div className="md:col-span-2 space-y-4 max-h-96 overflow-y-auto pr-2">
                  {reviews.map(review => (
                    <div key={review.id} className="border-b border-gray-100 pb-4 bg-gray-50 p-4 rounded-xl">
                      <div className="flex justify-between items-baseline mb-2">
                        <span className="font-bold text-pink-600 text-lg">{review.name}</span>
                        <span className="text-xs bg-pink-100 text-pink-800 px-3 py-1 rounded-full font-semibold">{review.drama}</span>
                      </div>
                      <p className="text-gray-700 leading-relaxed">{review.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </section>
            
          </main>

          {/* REPRODUCTOR DE MÚSICA FASHION FLOTANTE */}
          <div className="fixed bottom-6 right-6 z-40 bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-3 pr-5 border-2 border-pink-300 flex items-center gap-4 animate-fade-in">
            <div className={`relative w-12 h-12 rounded-full overflow-hidden border-2 border-pink-500 shadow-md flex items-center justify-center bg-pink-900 ${isPlayingMusic ? 'spin-slow' : ''}`}>
              <span className="text-xl">💿</span>
            </div>
            
            <div className="flex flex-col">
              <span className="text-xs font-bold text-pink-600 tracking-wider uppercase">OST K-Drama Hub</span>
              <span className="text-xs text-gray-500 font-medium">{isPlayingMusic ? 'Reproduciendo...' : 'Pausado'}</span>
            </div>

            <button 
              onClick={() => setIsPlayingMusic(!isPlayingMusic)}
              className="bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold w-10 h-10 rounded-full transition-all shadow-md flex items-center justify-center active:scale-95 ml-2">
              {isPlayingMusic ? '⏸️' : '▶️'}
            </button>

            {isPlayingMusic && (
              <div className="hidden">
                <iframe 
                  src="https://www.youtube-nocookie.com/embed/-PQGsN_Xx9o?autoplay=1&loop=1&playlist=-PQGsN_Xx9o" 
                  allow="autoplay"
                  frameBorder="0">
                </iframe>
              </div>
            )}
          </div>

          {activeTrailer && (
            <div className="fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white rounded-2xl overflow-hidden max-w-2xl w-full shadow-2xl relative border border-pink-200">
                <div className="bg-pink-600 text-white px-6 py-4 flex justify-between items-center">
                  <h3 className="font-bold text-lg">Tráiler: {activeTrailer.title}</h3>
                  <button onClick={() => setActiveTrailer(null)} className="text-white hover:text-pink-200 text-2xl font-bold">&times;</button>
                </div>
                <div className="relative pb-[56.25%] h-0 bg-black">
                  <iframe 
                    className="absolute top-0 left-0 w-full h-full"
                    src={`https://www.youtube-nocookie.com/embed/${activeTrailer.youtubeId}?autoplay=1`}
                    title={activeTrailer.title}
                    frameBorder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen>
                  </iframe>
                </div>
                <div className="p-4 bg-pink-50 flex justify-between items-center">
                  <span className="text-xs text-gray-500 font-medium">Reproduciendo vía YouTube</span>
                  <button onClick={() => setActiveTrailer(null)} className="bg-pink-500 hover:bg-pink-600 text-white font-bold px-6 py-2 rounded-lg text-sm transition-colors shadow-sm">Cerrar Tráiler</button>
                </div>
              </div>
            </div>
          )}

          <footer className="mt-8 text-center text-pink-600 pb-8 pt-6 border-t-2 border-pink-200 max-w-4xl mx-auto bg-white rounded-t-3xl shadow-inner">
            <p className="font-extrabold text-xl mb-1">Proyecto de Desarrollo Web</p>
            <p className="text-md font-medium text-gray-600">Diseñado y creado por <span className="text-pink-500 font-bold">Karen Izamar Sanchez Reyes</span></p>
            <p className="text-xs text-pink-400 mt-4">© 2026 K-Drama Hub App • Todos los derechos reservados</p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
